name: CI (GPU, automatic runner)

# `ci.yml` on one self-hosted GPU runner chosen at run time: kkt unless it is offline,
# else occidata (see select-gpu-runner.yml). For pushes to main and tags, where a
# package wants a single GPU run; pull requests keep their per-runner labels
# (`run ci kkt-runner`, `run ci occidata-runner`).

on:
  workflow_call:
    inputs:
      versions:
        description: "Julia versions to test (JSON array)"
        required: false
        type: string
        default: '["1"]'
      use_ct_registry:
        description: "Whether the local ct-registry is added or not"
        required: false
        default: false
        type: boolean
      test_args:
        description: "Arguments string forwarded to julia-runtest's test_args (e.g. 'GPU')"
        required: false
        type: string
        default: ''
    secrets:
      SSH_KEY:
        required: false
      RUNNERS_STATUS_TOKEN:
        required: false

jobs:
  select:
    uses: control-toolbox/CTActions/.github/workflows/select-gpu-runner.yml@main
    secrets:
      RUNNERS_STATUS_TOKEN: ${{ secrets.RUNNERS_STATUS_TOKEN }}

  test:
    needs: select
    uses: control-toolbox/CTActions/.github/workflows/ci.yml@main
    with:
      versions: ${{ inputs.versions }}
      runs_on: ${{ needs.select.outputs.runs_on_matrix }}
      runner_type: 'self-hosted'
      use_ct_registry: ${{ inputs.use_ct_registry }}
      test_args: ${{ inputs.test_args }}
    secrets:
      SSH_KEY: ${{ secrets.SSH_KEY }}
