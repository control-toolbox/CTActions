name: CI (GPU, automatic runner)

# `ci.yml` on one self-hosted GPU runner chosen at run time: kkt unless it is offline,
# else occidata (see select-gpu-runner.yml). For pushes to main and tags, where a
# package wants a single GPU run; pull requests keep their per-runner labels
# (`run ci kkt-runner`, `run ci occidata-runner`).

on:
  workflow_call:
    inputs:
      versions:
        description: "Julia versions to test (JSON array)"
        required: false
        type: string
        default: '["1"]'
      use_ct_registry:
        description: "Whether the local ct-registry is added or not"
        required: false
        default: false
        type: boolean
      test_args:
        description: "Arguments string forwarded to julia-runtest's test_args (e.g. 'GPU')"
        required: false
        type: string
        default: ''
      upload_artifact_path:
        description: "Optional file or directory to upload after tests, including on failure"
        required: false
        type: string
        default: ''
      upload_artifact_name:
        description: "Optional base name for the test artifact; matrix identity is appended"
        required: false
        type: string
        default: ''
      upload_artifact_if_no_files:
        description: "Behavior when the artifact path is missing: warn, error, or ignore"
        required: false
        type: string
        default: warn
      upload_artifact_retention_days:
        description: "Optional artifact retention in days; empty keeps the repository default"
        required: false
        type: string
        default: ''
      upload_artifact_include_hidden_files:
        description: "Whether hidden files are included in the test artifact"
        required: false
        type: boolean
        default: false
      fail_fast:
        description: "Cancel the other matrix jobs when one fails (GitHub default). Set false to keep every platform running, e.g. to collect one report per platform."
        required: false
        type: boolean
        default: true
    secrets:
      SSH_KEY:
        required: false
      CT_RUNNERS_CLIENT_ID:
        required: false
      CT_RUNNERS_PRIVATE_KEY:
        required: false

jobs:
  select:
    uses: control-toolbox/CTActions/.github/workflows/select-gpu-runner.yml@main
    secrets:
      CT_RUNNERS_CLIENT_ID: ${{ secrets.CT_RUNNERS_CLIENT_ID }}
      CT_RUNNERS_PRIVATE_KEY: ${{ secrets.CT_RUNNERS_PRIVATE_KEY }}

  test:
    needs: select
    uses: control-toolbox/CTActions/.github/workflows/ci.yml@main
    with:
      versions: ${{ inputs.versions }}
      runs_on: ${{ needs.select.outputs.runs_on_matrix }}
      runner_type: 'self-hosted'
      use_ct_registry: ${{ inputs.use_ct_registry }}
      test_args: ${{ inputs.test_args }}
      upload_artifact_path: ${{ inputs.upload_artifact_path }}
      upload_artifact_name: ${{ inputs.upload_artifact_name }}
      upload_artifact_if_no_files: ${{ inputs.upload_artifact_if_no_files }}
      upload_artifact_retention_days: ${{ inputs.upload_artifact_retention_days }}
      upload_artifact_include_hidden_files: ${{ inputs.upload_artifact_include_hidden_files }}
      fail_fast: ${{ inputs.fail_fast }}
    secrets:
      SSH_KEY: ${{ secrets.SSH_KEY }}
