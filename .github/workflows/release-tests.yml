name: Release tests

# Self-test of the release tool, in CTActions itself: the test suite of scripts/release
# (unit tests on fakes and throwaway git repositories, integration tests against General)
# on every supported Julia version. Runs when the scripts or the release workflows change.

on:
  pull_request:
    paths:
      - 'scripts/release/**'
      - '.github/workflows/release-*.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/release/**'
      - '.github/workflows/release-*.yml'
  workflow_dispatch:

concurrency:
  group: release-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1.12', '1.13']
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - name: Add the General registry
        run: julia --startup-file=no -e 'using Pkg; Pkg.Registry.add("General")'
      - name: Tests
        run: julia --startup-file=no scripts/release/test/runtests.jl
