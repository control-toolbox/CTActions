name: Compat prune

# Finds the [compat] specifiers that no supported Julia version ever selects across the
# control-toolbox packages, proves that dropping them leaves every resolved manifest
# unchanged, and (unless dry_run) opens one PR per affected repository plus one tracking
# issue in the calling repository, both updated in place by later runs.
# Called monthly by OptimalControl (`CompatPrune.yml`); see docs/WORKFLOWS.md §3.1.
#
# The `audit` job is read-only: it resolves the joint, test and docs environments of every
# package on every Julia version (Pkg's resolver only: nothing is downloaded or installed),
# classifies the multi-specifier entries, validates the prunes, applies them to fresh
# checkouts of the default branches, and uploads the result (`compat-prune` artifact,
# report in the job summary). Scripts and tests: scripts/compat-prune/.

on:
  workflow_call:
    inputs:
      packages:
        description: 'JSON list of the audited packages (registered names)'
        required: false
        type: string
        default: '["CTBase","CTParser","CTModels","CTLie","CTFlows","CTDirect","CTSolvers","OptimalControl"]'
      julia_versions:
        description: 'JSON list of the Julia versions (juliaup channels); the last one is the newest'
        required: false
        type: string
        default: '["1.10","1.12","1.13"]'
      dry_run:
        description: 'Only audit and report: no PR, no issue'
        required: false
        type: boolean
        default: true
      ctactions_ref:
        description: 'Ref of CTActions the scripts are checked out from'
        required: false
        type: string
        default: main

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      PACKAGES: ${{ inputs.packages }}
      JULIA_VERSIONS: ${{ inputs.julia_versions }}
      SCRIPTS: ctactions/scripts/compat-prune
      OUT: ${{ github.workspace }}/compat-prune
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: control-toolbox/CTActions
          ref: ${{ inputs.ctactions_ref }}
          path: ctactions

      - uses: julia-actions/install-juliaup@v3
        with:
          channel: release

      - name: Install the audited Julia versions
        run: |
          for v in $(jq -r '.[]' <<< "$JULIA_VERSIONS"); do juliaup add "$v"; done
          juliaup status

      # ct-registry is public: added over HTTPS, no SSH key needed. The registries are
      # updated once more by audit.jl, then frozen for the whole audit.
      - name: Add the registries
        run: |
          julia --startup-file=no -e 'using Pkg
            Pkg.Registry.add("General")
            Pkg.Registry.add(url="https://github.com/control-toolbox/ct-registry.git")'

      - name: Test the scripts
        run: julia --startup-file=no "$SCRIPTS/test/runtests.jl"

      - name: Audit
        run: julia --startup-file=no "$SCRIPTS/audit.jl" "$PACKAGES" "$JULIA_VERSIONS" "$OUT"

      - name: Apply the prunes to fresh checkouts of the default branches
        run: |
          mkdir -p checkouts
          julia --startup-file=no -e 'using TOML
            for (n, p) in TOML.parsefile(ARGS[1])["packages"]
                println(n, " ", p["repo"], " ", p["default_branch"])
            end' "$OUT/index.toml" |
          while read -r name repo branch; do
            git clone --quiet --depth 1 --branch "$branch" "https://github.com/$repo.git" "checkouts/$name"
          done
          julia --startup-file=no "$SCRIPTS/edit.jl" "$OUT" checkouts
          for d in checkouts/*/; do
            git -C "$d" diff --src-prefix="a/$(basename "$d")/" --dst-prefix="b/$(basename "$d")/"
          done > "$OUT/edits.diff"

      - name: Report
        run: |
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            julia --startup-file=no "$SCRIPTS/report.jl" "$OUT"
          {
            cat "$OUT/report.md"
            echo
            echo "<details><summary>Edits on the default branches (diff)</summary>"
            echo
            echo '```diff'
            cat "$OUT/edits.diff"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: compat-prune
          path: compat-prune/
          retention-days: 30
