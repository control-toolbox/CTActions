name: Token expiry

# Weekly check of the PAT behind RUNNERS_STATUS_TOKEN (scripts/check-token-expiry.sh):
# opens an issue when it is rejected, lacks its permission or expires within 30 days.
# The report uses only github.token, so it still works the day the PAT does not.
# Without it select-gpu-runner.yml falls back to occidata without failing: this check is
# what tells "the token expired" from "occidata is just slow".

on:
  schedule:
    - cron: '47 3 * * 6'   # Saturdays, 03:47 UTC
  workflow_dispatch:

concurrency:
  group: token-expiry
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Check RUNNERS_STATUS_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
          TOKEN_UNDER_TEST: ${{ secrets.RUNNERS_STATUS_TOKEN }}
        run: bash scripts/check-token-expiry.sh
