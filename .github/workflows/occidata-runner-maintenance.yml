name: Occidata Runner Maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * 1'   # every Monday at 02:30 UTC

jobs:
  cleanup:
    runs-on: [self-hosted, occidata]
    steps:
      # The runner isolates the jobs' git config in $GHA_ROOT/home/.gitconfig
      # (the jobs' own HOME, set by runner.slurm). The script, versioned in
      # control-toolbox/occidata (scripts/), removes url.*.insteadOf rewrites — a
      # https -> git@github.com: rewrite broke every checkout on 2026-09-28, the
      # cluster having no SSH key — dedups safe.directory and checks HTTPS access.
      # First step, so that it runs even if a later one fails.
      - name: Sanitize the runner's git config
        run: bash /projects/ctb/gha-runner/scripts/sanitize_runner_gitconfig.sh

      - name: Purge Julia cache
        run: rm -rf /projects/ctb/gha-runner/julia_depot/compiled || true

      - name: Update TeXLive
        run: |
          export PATH=/projects/ctb/gha-runner/texlive/2025/bin/x86_64-linux:$PATH
          tlmgr update --self --all

      - name: Rotate logs older than 30 days
        run: find /projects/ctb/gha-runner/logs -type f -mtime +30 -delete || true

      # Companion to `export TMPDIR=$GHA_ROOT/tmp` in the runner's runner.slurm,
      # which keeps temporary files (notably Pkg.test's sandbox environment) off
      # the node's /tmp — wiped wholesale every hour at HH:01, which killed any CI
      # run crossing the top of an hour. Unlike /tmp, that directory has no cleaner
      # of its own, hence this prune. `-mtime +2` cannot touch a live sandbox: a
      # CI run lasts under an hour. No-op (|| true) while runner.slurm has not been
      # updated yet and the directory does not exist.
      - name: Prune the runner's private TMPDIR
        run: find /projects/ctb/gha-runner/tmp -mindepth 1 -maxdepth 1 -mtime +2 -exec rm -rf {} + || true
