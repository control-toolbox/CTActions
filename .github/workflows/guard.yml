name: Guard

# The first job of ci.yml, coverage.yml, breakage-suite.yml and documentation.yml: whether
# the jobs that follow run. One workflow, called with the scope and the job, so that the
# four callers do not repeat it (docs/workflows/guard.md, docs/workflows/ci-on-main.md).
#
# The job always runs, so it is never a skipped ancestor of the jobs below, and it never
# fails the run: its output `run` is 'false' only when a rule says so; a failure of the job
# itself leaves the output empty, and the jobs below then run (`!cancelled()`).
#
#   1. a pull request that is not open (a label added or removed while it is closed):
#      run=false, nothing is checked out;
#   2. a push to main: the label `ci on main: changes only`
#      (.github/actions/changes-only);
#   3. anything else (an open pull request, a tag, a manual run, the cron): run=true.

on:
  workflow_call:
    inputs:
      scope:
        description: "What the guarded job tests: tests, coverage, breakage or docs"
        required: true
        type: string
      job:
        description: "Id of the guarded job in its reusable workflow (test, coverage, break, build)"
        required: true
        type: string
      ctactions_ref:
        description: "Ref of CTActions whose scripts the job runs (main; a branch to test a change)"
        required: false
        type: string
        default: main
      actors:
        description: "Logins allowed to set the label (the organization variable CT_CI_CHANGES_ONLY_ACTORS); empty means the default list of the script"
        required: false
        type: string
        default: ''
    outputs:
      run:
        description: "'true' or 'false'"
        value: ${{ jobs.guard.outputs.run }}
      base_run:
        description: "Id of the run the diff starts from, empty when there is none"
        value: ${{ jobs.guard.outputs.base_run }}
      reason:
        description: "Why"
        value: ${{ jobs.guard.outputs.reason }}

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      # 'false' is a non-empty string, so it wins the `||` when the pull request is closed
      run: ${{ steps.closed.outputs.run || steps.decide.outputs.run || 'true' }}
      base_run: ${{ steps.decide.outputs.base_run }}
      reason: ${{ steps.closed.outputs.reason || steps.decide.outputs.reason }}
    steps:
      - name: A pull request that is not open
        id: closed
        if: github.event_name == 'pull_request' && github.event.pull_request.state != 'open'
        env:
          JOB: ${{ inputs.job }}
        run: |
          {
            echo "run=false"
            echo "reason=the pull request is not open"
          } >> "$GITHUB_OUTPUT"
          echo "\`$JOB\`: skipped, the pull request is not open." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          fetch-depth: 0

      - uses: actions/checkout@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          repository: control-toolbox/CTActions
          ref: ${{ inputs.ctactions_ref }}
          path: .ctactions

      - id: decide
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.ctactions/.github/actions/changes-only
        with:
          scope: ${{ inputs.scope }}
          job: ${{ inputs.job }}
          actors: ${{ inputs.actors }}
