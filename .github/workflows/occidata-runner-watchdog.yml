name: Occidata Runner Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * *'

permissions:
  contents: read

jobs:
  check-and-restart:
    name: Restart missing Occidata runner jobs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OCCIDATA_SSH_KEY: ${{ secrets.OCCIDATA_SSH_KEY }}
      OCCIDATA_KNOWN_HOSTS: ${{ secrets.OCCIDATA_KNOWN_HOSTS }}
    steps:
      - name: Check required secrets
        id: secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${OCCIDATA_SSH_KEY}" || -z "${OCCIDATA_KNOWN_HOSTS}" ]]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Required watchdog secrets are not configured; skipping restart.'
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare SSH credentials
        if: steps.secrets.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d "$RUNNER_TEMP/occidata-ssh"
          printf '%s\n' "$OCCIDATA_SSH_KEY" > "$RUNNER_TEMP/occidata-ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/occidata-ssh/id_ed25519"
          printf '%s\n' "$OCCIDATA_KNOWN_HOSTS" > "$RUNNER_TEMP/occidata-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/occidata-ssh/known_hosts"

      # Occidata hosts one runner per GitHub organization (control-toolbox, ocourses),
      # each in its own 7-day SLURM job. The instances are listed in runners.conf,
      # next to start_runners.sh, which starts those whose job is neither pending
      # nor running and leaves the others alone — both versioned in
      # control-toolbox/occidata (scripts/). Hence no GitHub-side status check: the
      # SLURM queue is the source of truth, and runners of other organizations
      # could not be listed with this organization's token anyway.
      - name: Start missing runner jobs
        if: steps.secrets.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$RUNNER_TEMP/occidata-ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/occidata-ssh/known_hosts" \
            ocots@occidata-cluster.irit.fr \
            bash /projects/ctb/gha-runner/scripts/start_runners.sh
