name: Auto Assign

on:
  workflow_call:
    inputs:
      assignees:
        required: true
        type: string
      numOfAssignee:
        required: true
        type: string

# One run at a time per issue or PR, none cancelled: a release PR is opened, closed and reopened
# within seconds, so `opened` and `reopened` start two runs together, and two assignments at
# once fail with "Assignee has already been taken" (422).
concurrency:
  group: auto-assign-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  run:
    # A pull request from a fork has a read-only token: assigning would fail with a 403.
    # The maintainer assigns it by hand.
    if: github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: 'Auto-assign issue'
        uses: pozil/auto-assign-issue@v4
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          assignees: ${{ inputs.assignees }}
          numOfAssignee: ${{ inputs.numOfAssignee }}
