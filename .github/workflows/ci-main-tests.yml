name: CI on main tests

# Self-test of the changes-only decision (docs/workflows/ci-on-main.md): the unit tests of
# scripts/ci-main, on fakes of `gh` and `git` and on throwaway repositories. Runs when the
# script or the workflows it guards change.

on:
  pull_request:
    paths:
      - 'scripts/ci-main/**'
      - '.github/actions/changes-only/**'
      - '.github/workflows/guard.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/coverage.yml'
      - '.github/workflows/breakage-suite.yml'
      - '.github/workflows/documentation.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/ci-main/**'
      - '.github/actions/changes-only/**'
  workflow_dispatch:

concurrency:
  group: ci-main-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Tests
        run: julia --startup-file=no scripts/ci-main/test/runtests.jl
