name: Breakage suite

# Tests the downstream packages against the package under test, then reports once. The
# downstream packages are derived, not listed: every package of the organization that loads
# the package under test (its `deps`, `weakdeps`, `extras` or test environment, read from the
# Project.toml files by scripts/breakage/consumers.jl), plus the `targets` the caller declares
# for what cannot be derived (an application owned elsewhere, a documentation build). Each
# cell of the matrix (a downstream package × its default branch `latest` or its newest tag
# `stable`) runs its tests or builds its docs, and writes its result as a file; one `report`
# job gathers them in one table (job summary, one PR comment per group, kept up to date
# through a marker, and the `breakage-<group>` artifact: the baseline of later runs).
#
# A downstream failure does not fail the run: a breaking change is expected to break. On a
# release PR (the version changes), the report checks REL1 of ct-conventions against the
# run on the base commit: a downstream package whose **stable** column passes on the base
# and fails with the PR is broken by the release, so the version must be breaking. Without
# that run on the base, or with cells missing, a release PR fails: run this workflow on
# `main` first (callers run it on push to `main` and by hand). Script and tests:
# scripts/breakage/; see docs/workflows/breakage-suite.md. Replaced breakage.yml
# (removed, CTActions#162).

on:
  workflow_call:
    inputs:
      targets:
        description: 'JSON list of declared targets, added to the derived ones: {"name", "owner" (default control-toolbox), "break" ("test", default, or "doc")}'
        required: false
        type: string
        default: '[]'
      consumers:
        description: 'Derive the downstream packages from the Project.toml files of the organization'
        required: false
        type: boolean
        default: true
      versions:
        description: 'JSON list of the versions of each downstream package'
        required: false
        type: string
        default: '["latest", "stable"]'
      group:
        description: 'Name of this suite: its PR comment and its artifact'
        required: false
        type: string
        default: packages
      use_ct_registry:
        required: false
        type: boolean
        default: false
      ctactions_ref:
        description: 'Ref of CTActions the scripts are checked out from'
        required: false
        type: string
        default: main
    secrets:
      SSH_KEY:
        required: false

# Superseded runs: on a pull request, a new run cancels the previous one of the same pull
# request (docs/workflows/superseded-runs.md). On a push to main, a tag, a schedule or a manual
# run, the group is the run itself: nothing is cancelled and nothing waits. Declared here,
# not in the caller: a label that changes nothing creates a run whose calling job is
# skipped, and a `concurrency` of the caller would still cancel the run in progress. The
# group starts with a name of its own: it must differ from every group of a caller.
# `group` keeps apart the suites called by one caller workflow.
# A run started by label-dispatch.yml (a `workflow_dispatch` with the input `pr`) is a
# run of that pull request: same group, same cancellation.
concurrency:
  group: ctactions-breakage-suite-${{ github.workflow }}-${{ inputs.group }}-${{ github.event.pull_request.number || github.event.inputs.pr || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.pr != '') }}

jobs:
  # A run started by label-dispatch.yml shows as a commit status (pr-status.yml).
  status-start:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.pr != '' }}
    permissions:
      statuses: write
    uses: control-toolbox/CTActions/.github/workflows/pr-status.yml@main
    with:
      context: Breakage / ${{ inputs.group }}
      phase: start

  status-end:
    needs: [changes, carry-baseline, plan, break, report]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.event.inputs.pr != '' }}
    permissions:
      statuses: write
    uses: control-toolbox/CTActions/.github/workflows/pr-status.yml@main
    with:
      context: Breakage / ${{ inputs.group }}
      phase: end
      results: ${{ toJSON(needs.*.result) }}

  # Whether the suite runs (docs/workflows/guard.md): no on a pull request that is not open;
  # on a push to main, yes unless the merged pull request carries the label
  # `ci on main: changes only` (docs/workflows/ci-on-main.md); yes otherwise. When it does
  # not run on main, `carry-baseline` below gives this run the baseline of the last real one,
  # because a release PR reads the baseline of the run on its base commit.
  changes:
    permissions:
      contents: read
      pull-requests: read
      actions: read
    uses: control-toolbox/CTActions/.github/workflows/guard.yml@main
    with:
      scope: breakage
      job: break
      ctactions_ref: ${{ inputs.ctactions_ref }}
      actors: ${{ vars.CT_CI_CHANGES_ONLY_ACTORS }}

  carry-baseline:
    needs: changes
    if: ${{ needs.changes.outputs.run == 'false' && needs.changes.outputs.base_run != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download the baseline of the last real run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ needs.changes.outputs.base_run }}
          GROUP: ${{ inputs.group }}
        run: gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name "breakage-$GROUP" --dir baseline

      - uses: actions/upload-artifact@v7
        with:
          name: breakage-${{ inputs.group }}
          path: baseline/

  plan:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: control-toolbox/CTActions
          ref: ${{ inputs.ctactions_ref }}
          path: .ctactions

      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'

      # fails, rather than testing fewer packages, when the organization cannot be read; an
      # empty list when there is nothing to test (no cell runs, the suite passes); the table
      # of targets goes to the job summary
      - name: Targets
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          DECLARED: ${{ inputs.targets }}
          DERIVE: ${{ inputs.consumers }}
        run: |
          set -euo pipefail
          args=(plan --project Project.toml --declared "$DECLARED" --summary "$GITHUB_STEP_SUMMARY")
          [ "$DERIVE" = true ] || args+=(--no-derive)
          targets=$(julia --startup-file=no .ctactions/scripts/breakage/consumers.jl "${args[@]}")
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  break:
    needs: plan
    # `!cancelled()`: `changes` (two levels up) is skipped outside a push to `main`, and the
    # default `success()` of a `needs` is false when a job anywhere upstream was skipped,
    # even though `plan` ran: without it no cell would run on a pull request. No cell when
    # there is nothing to test: an empty matrix is an error for GitHub Actions.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.targets != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
        version: ${{ fromJSON(inputs.versions) }}
    env:
      NAME: ${{ matrix.target.name }}
      OWNER: ${{ matrix.target.owner || 'control-toolbox' }}
      BREAK: ${{ matrix.target.break || 'test' }}
      VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Julia
        id: julia
        uses: julia-actions/setup-julia@v3
        with:
          version: '1'

      - name: Add ct-registry
        if: inputs.use_ct_registry
        uses: control-toolbox/CTActions/.github/actions/add-ct-registry@main
        with:
          key: ${{ secrets.SSH_KEY }}
          skip_on_stable: 'false'   # the dependents may need betas of their own

      - name: Cache Julia artifacts
        uses: actions/cache@v6
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-breakage-julia-${{ steps.julia.outputs.julia-version }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-breakage-julia-${{ steps.julia.outputs.julia-version }}-

      - uses: julia-actions/julia-buildpkg@v1

      - uses: actions/checkout@v7
        with:
          repository: control-toolbox/CTActions
          ref: ${{ inputs.ctactions_ref }}
          path: .ctactions

      # a downstream failure is a result (the cell says `fail`), not a failure of the job
      - name: Test ${{ matrix.target.name }} (${{ matrix.target.break || 'test' }}, ${{ matrix.version }})
        run: |
          julia --startup-file=no .ctactions/scripts/breakage/cell.jl --name "$NAME" --owner "$OWNER" \
            --break "$BREAK" --version "$VERSION" --source . --out cells \
            --job "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - uses: actions/upload-artifact@v7
        with:
          name: breakage-cell-${{ inputs.group }}-${{ matrix.target.name }}-${{ matrix.target.break || 'test' }}-${{ matrix.version }}
          path: cells/

  report:
    needs: [plan, break]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read          # the artifact of the run on the base commit
      pull-requests: write   # the comment
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/checkout@v7
        with:
          repository: control-toolbox/CTActions
          ref: ${{ inputs.ctactions_ref }}
          path: .ctactions

      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'

      # no cell when there is nothing to test: the report then has no row, and its
      # `breakage.toml` is the (empty) baseline of a release PR
      - uses: actions/download-artifact@v8
        if: needs.break.result != 'skipped'
        with:
          path: cells/
          pattern: breakage-cell-${{ inputs.group }}-*
          merge-multiple: true

      # The pull request of this run: the event's on a `pull_request`, the input `pr` on a
      # dispatch from label-dispatch.yml, none on a push, a manual run or the cron.
      - name: Pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr }}
        run: |
          [ -n "$NUMBER" ] || exit 0
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          julia --startup-file=no .ctactions/scripts/breakage/pr.jl facts --repo "$GITHUB_REPOSITORY" --pr "$NUMBER" >> "$GITHUB_OUTPUT"

      # On a PR: the run of this workflow on the base commit, outside a PR (push or dispatch)
      - name: Baseline
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          GROUP: ${{ inputs.group }}
        run: |
          julia --startup-file=no .ctactions/scripts/breakage/pr.jl baseline --repo "$GITHUB_REPOSITORY" \
            --workflow "$(basename "${WORKFLOW_REF%%@*}")" --sha "$BASE_SHA" --group "$GROUP" --dir baseline

      - name: Report
        id: report
        env:
          TARGETS: ${{ needs.plan.outputs.targets }}
          VERSIONS: ${{ inputs.versions }}
          GROUP: ${{ inputs.group }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          expected=$(( $(jq length <<< "$TARGETS") * $(jq length <<< "$VERSIONS") ))
          args=(cells out --expected "$expected" --group "$GROUP" --sha "$SHA")
          [ -f baseline/breakage.toml ] && args+=(--baseline baseline/breakage.toml)
          [ -n "$BASE_SHA" ] && args+=(--base-sha "$BASE_SHA")
          mkdir -p cells
          set +e
          julia --startup-file=no .ctactions/scripts/breakage/report.jl "${args[@]}"
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat out/summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: breakage-${{ inputs.group }}
          path: out/

      # Not on a pull request from a fork: its token is read-only and the comment would
      # fail the job (and hide the verdict below). The report is in the run's summary.
      - name: Comment on the PR
        if: steps.pr.outputs.number != '' && steps.pr.outputs.fork != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
          GROUP: ${{ inputs.group }}
        run: |
          julia --startup-file=no .ctactions/scripts/breakage/pr.jl comment --repo "$GITHUB_REPOSITORY" \
            --pr "$PR" --group "$GROUP" --file out/summary.md

      - name: Verdict
        env:
          CODE: ${{ steps.report.outputs.code }}
        run: exit "${CODE:-1}"
