name: Breakage suite

# Tests the downstream packages against the package under test, then reports once. The
# downstream packages are derived, not listed: every package of the organization that loads
# the package under test (its `deps`, `weakdeps`, `extras` or test environment, read from the
# Project.toml files by scripts/breakage/consumers.jl), plus the `targets` the caller declares
# for what cannot be derived (an application owned elsewhere, a documentation build). Each
# cell of the matrix (a downstream package × its default branch `latest` or its newest tag
# `stable`) runs its tests or builds its docs, and writes its result as a file; one `report`
# job gathers them in one table (job summary, one PR comment per group, kept up to date
# through a marker, and the `breakage-<group>` artifact: the baseline of later runs).
#
# A downstream failure does not fail the run: a breaking change is expected to break. On a
# release PR (the version changes), the report checks REL1 of ct-conventions against the
# run on the base commit: a downstream package whose **stable** column passes on the base
# and fails with the PR is broken by the release, so the version must be breaking. Without
# that run on the base, or with cells missing, a release PR fails: run this workflow on
# `main` first (callers run it on push to `main` and by hand). Script and tests:
# scripts/breakage/; see docs/workflows/breakage-suite.md. Replaces breakage.yml, kept until
# every caller has moved.

on:
  workflow_call:
    inputs:
      targets:
        description: 'JSON list of declared targets, added to the derived ones: {"name", "owner" (default control-toolbox), "break" ("test", default, or "doc")}'
        required: false
        type: string
        default: '[]'
      consumers:
        description: 'Derive the downstream packages from the Project.toml files of the organization'
        required: false
        type: boolean
        default: true
      versions:
        description: 'JSON list of the versions of each downstream package'
        required: false
        type: string
        default: '["latest", "stable"]'
      group:
        description: 'Name of this suite: its PR comment and its artifact'
        required: false
        type: string
        default: packages
      use_ct_registry:
        required: false
        type: boolean
        default: false
      ctactions_ref:
        description: 'Ref of CTActions the scripts are checked out from'
        required: false
        type: string
        default: main
    secrets:
      SSH_KEY:
        required: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: control-toolbox/CTActions
          ref: ${{ inputs.ctactions_ref }}
          path: .ctactions

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      # fails, rather than testing fewer packages, when the organization cannot be read or
      # when there is nothing to test; the table of targets goes to the job summary
      - name: Targets
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          DECLARED: ${{ inputs.targets }}
          DERIVE: ${{ inputs.consumers }}
        run: |
          set -euo pipefail
          args=(plan --project Project.toml --declared "$DECLARED" --summary "$GITHUB_STEP_SUMMARY")
          [ "$DERIVE" = true ] || args+=(--no-derive)
          targets=$(julia --startup-file=no .ctactions/scripts/breakage/consumers.jl "${args[@]}")
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  break:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
        version: ${{ fromJSON(inputs.versions) }}
    env:
      NAME: ${{ matrix.target.name }}
      OWNER: ${{ matrix.target.owner || 'control-toolbox' }}
      BREAK: ${{ matrix.target.break || 'test' }}
      VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Julia
        id: julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - name: Add ct-registry
        if: inputs.use_ct_registry
        uses: control-toolbox/CTActions/.github/actions/add-ct-registry@main
        with:
          key: ${{ secrets.SSH_KEY }}

      - name: Cache Julia artifacts
        uses: actions/cache@v5
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-breakage-julia-${{ steps.julia.outputs.julia-version }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-breakage-julia-${{ steps.julia.outputs.julia-version }}-

      - uses: julia-actions/julia-buildpkg@v1

      - name: Test ${{ matrix.target.name }} (${{ matrix.target.break || 'test' }}, ${{ matrix.version }})
        run: |
          set -uo pipefail
          SRC_NAME=$(basename "$PWD" .jl)
          git clone --quiet "https://github.com/$OWNER/$NAME.jl" repo
          cd repo
          case "$VERSION" in
            latest) TAG=$(git rev-parse --abbrev-ref HEAD) ;;
            stable) git fetch --quiet --tags; TAG=$(git tag -l "v*" --sort=-creatordate | head -n1)
                    if [ -n "$TAG" ]; then git checkout --quiet "$TAG"; fi ;;
            *)      TAG="$VERSION"; git fetch --quiet --tags; git checkout --quiet "$TAG" || TAG="" ;;
          esac
          status=pass
          # the single-quoted program is Julia: $(…) in it is Julia's interpolation
          # shellcheck disable=SC2016
          if [ -z "$TAG" ]; then
            status=no_tag
          elif ! SRC_NAME="$SRC_NAME" julia --startup-file=no -e '
                using Pkg
                if ENV["BREAK"] == "test"
                    Pkg.activate("."); Pkg.instantiate(); Pkg.develop(path=".."); Pkg.build(); Pkg.test()
                elseif ENV["BREAK"] == "doc"
                    Pkg.activate("docs"); Pkg.instantiate(); Pkg.develop(path=".."); Pkg.build(); include("docs/make.jl")
                else
                    error("break must be test or doc, not $(ENV["BREAK"])")
                end'; then
            status=fail
          fi
          [ "$BREAK" = doc ] && PROJ=docs || PROJ=.
          COMPAT=$(SRC_NAME="$SRC_NAME" julia --startup-file=no --project="$PROJ" -e '
                using Pkg; v = get(Dict(p.name => p.version for p in values(Pkg.dependencies())), ENV["SRC_NAME"], nothing)
                v === nothing || print("v", v)' 2> /dev/null || true)
          mkdir -p ../cells
          cat > "../cells/$NAME-$BREAK-$VERSION.toml" <<TOML
          name = "$NAME"
          owner = "$OWNER"
          break = "$BREAK"
          version = "$VERSION"
          tag = "${TAG:-none}"
          compat = "$COMPAT"
          status = "$status"
          job = "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          TOML
          echo "$NAME ($BREAK, $VERSION at ${TAG:-no tag}): $status"

      - uses: actions/upload-artifact@v7
        with:
          name: breakage-cell-${{ inputs.group }}-${{ matrix.target.name }}-${{ matrix.target.break || 'test' }}-${{ matrix.version }}
          path: cells/

  report:
    needs: [plan, break]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read          # the artifact of the run on the base commit
      pull-requests: write   # the comment
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/checkout@v6
        with:
          repository: control-toolbox/CTActions
          ref: ${{ inputs.ctactions_ref }}
          path: .ctactions

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - uses: actions/download-artifact@v8
        with:
          path: cells/
          pattern: breakage-cell-${{ inputs.group }}-*
          merge-multiple: true

      # On a PR: the run of this workflow on the base commit, outside a PR (push or dispatch)
      - name: Baseline
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          GROUP: ${{ inputs.group }}
        run: |
          file=$(basename "${WORKFLOW_REF%%@*}")
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$file/runs?head_sha=$BASE_SHA&status=completed&per_page=50" \
                  --jq '[.workflow_runs[] | select(.event != "pull_request")][0].id // empty')
          if [ -n "$run" ] && gh run download "$run" --repo "$GITHUB_REPOSITORY" --name "breakage-$GROUP" --dir baseline; then
            echo "Baseline: run $run on $BASE_SHA"
          else
            echo "No baseline for $BASE_SHA"
          fi

      - name: Report
        id: report
        env:
          TARGETS: ${{ needs.plan.outputs.targets }}
          VERSIONS: ${{ inputs.versions }}
          GROUP: ${{ inputs.group }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          expected=$(( $(jq length <<< "$TARGETS") * $(jq length <<< "$VERSIONS") ))
          args=(cells out --expected "$expected" --group "$GROUP" --sha "$SHA")
          [ -f baseline/breakage.toml ] && args+=(--baseline baseline/breakage.toml)
          if [ -n "$BASE_SHA" ]; then
            v0=$(git show "$BASE_SHA:Project.toml" | sed -n 's/^version = "\(.*\)"/\1/p')
            v1=$(sed -n 's/^version = "\(.*\)"/\1/p' Project.toml)
            args+=(--base-version "$v0" --head-version "$v1")
          fi
          mkdir -p cells
          set +e
          julia --startup-file=no .ctactions/scripts/breakage/report.jl "${args[@]}"
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat out/summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: breakage-${{ inputs.group }}
          path: out/

      # Not on a pull request from a fork: its token is read-only and the comment would
      # fail the job (and hide the verdict below). The report is in the run's summary.
      - name: Comment on the PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork != true
        uses: actions/github-script@v9
        env:
          MARKER: <!-- ct-breakage:${{ inputs.group }} -->
        with:
          script: |
            const body = require('fs').readFileSync('out/summary.md', 'utf8')
            const issue_number = context.payload.pull_request.number
            const comments = await github.paginate(github.rest.issues.listComments,
              { owner: context.repo.owner, repo: context.repo.repo, issue_number })
            const mine = comments.find(c => c.body && c.body.startsWith(process.env.MARKER))
            if (mine) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: mine.id, body })
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number, body })
            }

      - name: Verdict
        env:
          CODE: ${{ steps.report.outputs.code }}
        run: exit "${CODE:-1}"
