name: Documentation

on:
  workflow_call:
    inputs:
      use_ct_registry:
        required: false
        default: false
        type: boolean
      # GPU-backed docs build (control-toolbox/OptimalControl.jl#885 part 2).
      # Default '' reproduces today's behaviour exactly for every caller: `build-gpu`
      # is skipped and only `build` runs. A caller opts in with e.g. '["occidata"]'.
      #
      # Design: *publish then upgrade*, not probe-then-fallback. `build` always runs
      # first and deploys, unchanged — so docs publishing never depends on a
      # self-hosted box being online. `build-gpu` runs only once `build` has
      # succeeded and, with `continue-on-error: true`, never fails the workflow: on
      # success it redeploys the same site with real GPU numbers; on failure or a
      # long SLURM queue (self-hosted GPU boxes are not always immediately
      # available) the already-published site from `build` is simply left in place.
      gpu_runner:
        description: "Self-hosted GPU runner labels for a docs-build upgrade pass (JSON array, e.g. '[\"occidata\"]'), or 'auto': kkt unless it is offline, else occidata (needs the CT_RUNNERS_* secrets). Empty (default) disables the pass entirely."
        required: false
        default: ''
        type: string
      gpu_timeout_minutes:
        description: "Timeout for the GPU upgrade pass. Budget for a cold build (self-hosted depots can be purged by maintenance jobs), not a warm one."
        required: false
        default: 120
        type: number
      ctactions_ref:
        description: "Ref of CTActions whose scripts the `changes` job runs (main; a branch to test a change)"
        required: false
        type: string
        default: main
    secrets:
      DOCUMENTER_KEY:
        description: 'Deploy key of gh-pages; optional: without it, Documenter deploys with GITHUB_TOKEN (what every caller does today)'
        required: false
      SSH_KEY:
        required: false
      CT_RUNNERS_CLIENT_ID:
        description: "ct-runners App, reads the state of the organization's runners for gpu_runner: 'auto'; without it the fallback (occidata) is used"
        required: false
      CT_RUNNERS_PRIVATE_KEY:
        required: false

jobs:
  # Whether the jobs below run (docs/workflows/guard.md): no on a pull request that is not
  # open; on a push to main, yes unless the merged pull request carries the label
  # `ci on main: changes only` (docs/workflows/ci-on-main.md); yes otherwise.
  changes:
    permissions:
      contents: read
      pull-requests: read
      actions: read
    uses: control-toolbox/CTActions/.github/workflows/guard.yml@main
    with:
      scope: docs
      job: build
      ctactions_ref: ${{ inputs.ctactions_ref }}
      actors: ${{ vars.CT_CI_CHANGES_ONLY_ACTORS }}

  build:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Setup Julia
        id: julia
        uses: julia-actions/setup-julia@latest
        with:
          version: '1.12'

      # Add ct-registry (only if use_registry is true and SSH_KEY is provided)
      - name: Add ct-registry
        if: inputs.use_ct_registry
        uses: control-toolbox/CTActions/.github/actions/add-ct-registry@main
        with:
          key: ${{ secrets.SSH_KEY }}

      # 🧰 Cache des artefacts (binaires des paquets)
      - name: Cache Julia artifacts
        uses: actions/cache@v6
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-julia-${{ steps.julia.outputs.julia-version }}-artifacts-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-julia-${{ steps.julia.outputs.julia-version }}-artifacts-

      # ⚡ Cache du code précompilé (fichiers .ji)
      - name: Cache Julia compiled code
        uses: actions/cache@v6
        with:
          path: ~/.julia/compiled
          key: ${{ runner.os }}-julia-${{ steps.julia.outputs.julia-version }}-compiled-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-julia-${{ steps.julia.outputs.julia-version }}-compiled-

      - uses: julia-actions/julia-buildpkg@latest

      - name: Install dependencies
        run: julia --project=docs/ -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'

      # PR previews are opt-in: `DOCUMENTER_PUSH_PREVIEW` is "true" only on a PR carrying
      # the `documentation push preview` label, "false" otherwise. A caller's make.jl reads
      # it as `push_preview = get(ENV, "DOCUMENTER_PUSH_PREVIEW", "false") == "true"`.
      # Inside a reusable workflow `github.event` is the caller's event, so the PR's labels
      # are visible here. A make.jl that still hardcodes `push_preview` ignores it.
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
          DOCUMENTER_PUSH_PREVIEW: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'documentation push preview') }}
          GKSwstype: 100
        run: |
          julia --project=docs/ -e 'ENV["GKSwstype"]="nul"; include("docs/make.jl")'
          echo "📂 Listing docs/build/assets:"
          ls -R docs/build/assets || true

  # The GPU upgrade pass. See the `gpu_runner` input doc above for the design
  # rationale. Never on the critical path of publishing: it only starts once
  # `build` has already deployed, and `continue-on-error: true` means its outcome
  # never fails the workflow either way.
  # With `gpu_runner: 'auto'`, `select-gpu` first picks kkt unless it is offline, else
  # occidata (select-gpu-runner.yml). Chosen once `build` is done, i.e. as late as
  # possible, since `build` can take a while.
  select-gpu:
    needs: build
    # `!cancelled()`: `changes` is skipped on a tag or a manual run, and the default
    # `success()` of a `needs` is false when a job anywhere upstream was skipped, even though
    # `build` ran.
    if: >
      !cancelled() && needs.build.result == 'success' &&
      inputs.gpu_runner == 'auto' && github.event_name != 'pull_request'
    uses: control-toolbox/CTActions/.github/workflows/select-gpu-runner.yml@main
    secrets:
      CT_RUNNERS_CLIENT_ID: ${{ secrets.CT_RUNNERS_CLIENT_ID }}
      CT_RUNNERS_PRIVATE_KEY: ${{ secrets.CT_RUNNERS_PRIVATE_KEY }}

  build-gpu:
    # `always()`: `select-gpu` is skipped unless `gpu_runner` is 'auto', and a skipped
    # need would skip this job too.
    needs: [build, select-gpu]
    if: >
      always() && needs.build.result == 'success' &&
      inputs.gpu_runner != '' && github.event_name != 'pull_request' &&
      (inputs.gpu_runner != 'auto' || needs.select-gpu.result == 'success')
    runs-on: ${{ fromJSON(inputs.gpu_runner == 'auto' && needs.select-gpu.outputs.runs_on_labels || inputs.gpu_runner) }}
    timeout-minutes: ${{ inputs.gpu_timeout_minutes }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup Julia
        id: julia
        uses: julia-actions/setup-julia@latest
        with:
          version: '1.12'

      # Self-hosted depots are persistent and not necessarily at ~/.julia (ci.yml's
      # own comment on this: setup-julia does not set JULIA_DEPOT_PATH, and
      # different self-hosted runners can have different real depot locations) —
      # ask Julia instead of guessing, same pattern as ci.yml.
      - name: Resolve Julia depot path
        id: depot
        run: echo "path=$(julia -e 'print(Base.DEPOT_PATH[1])')" >> "$GITHUB_OUTPUT"

      # The node's /tmp is wiped every hour at HH:01 (occidata specifically; see
      # ci.yml's "Keep the Pkg sandbox out of /tmp" step, commit 2f00b67). A docs
      # build is longer than a test run, so it will almost certainly cross an hour
      # boundary — redirect before any Julia step runs.
      - name: Redirect TMPDIR off the node's periodically-wiped /tmp
        run: |
          mkdir -p "$RUNNER_TEMP/jltmp"
          echo "TMPDIR=$RUNNER_TEMP/jltmp" >> "$GITHUB_ENV"

      - name: Add ct-registry
        if: inputs.use_ct_registry
        uses: control-toolbox/CTActions/.github/actions/add-ct-registry@main
        with:
          key: ${{ secrets.SSH_KEY }}

      - name: Cache Julia artifacts
        uses: actions/cache@v6
        with:
          path: ${{ steps.depot.outputs.path }}/artifacts
          key: ${{ runner.os }}-gpu-docs-julia-${{ steps.julia.outputs.julia-version }}-artifacts-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-gpu-docs-julia-${{ steps.julia.outputs.julia-version }}-artifacts-

      - name: Cache Julia compiled code
        uses: actions/cache@v6
        with:
          path: ${{ steps.depot.outputs.path }}/compiled
          key: ${{ runner.os }}-gpu-docs-julia-${{ steps.julia.outputs.julia-version }}-compiled-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-gpu-docs-julia-${{ steps.julia.outputs.julia-version }}-compiled-

      - uses: julia-actions/julia-buildpkg@latest

      - name: Install dependencies
        run: julia --project=docs/ -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'

      # Self-hosted depots persist, and are shared across jobs: Pkg runs a package's
      # `deps/build.jl` only when it installs the package, never when the sources are
      # already in the depot. A package whose build output is missing there (KNITRO.jl:
      # `deps/deps.jl`, "KNITRO.jl is not installed correctly") then fails to load for
      # good, while the same build on a GitHub-hosted runner (fresh depot) succeeds. Run
      # every build script of the docs environment again; it is idempotent.
      - name: Build the packages of the docs environment
        run: julia --project=docs/ -e 'using Pkg; Pkg.build(; verbose=true)'

      # Only the builds themselves need CUDA: on occidata they run on a GPU node
      # through $OCCIDATA_GPU_RUN (see ci.yml's self-hosted "Run tests" step);
      # the expansion is empty on any other runner. SLURM reads a bare number as
      # minutes, so the GPU allocation gets the same budget as the job.
      #
      # Self-hosted depots persist across runs and across branches, unlike
      # GitHub-hosted runners' fresh-per-job disk — a compiled/ cache left over
      # from a different Manifest can drift out of sync and break precompilation.
      # Retry once after purging it, as ci.yml's self-hosted "Run tests" step
      # does. continue-on-error is enough here because this step is a plain
      # `run:`, not a composite action.
      - name: Build and deploy
        id: build_deploy
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
          GKSwstype: 100
          OCCIDATA_GPU_TIME: ${{ inputs.gpu_timeout_minutes }}
        run: |
          ${OCCIDATA_GPU_RUN:-} julia --project=docs/ -e 'ENV["GKSwstype"]="nul"; include("docs/make.jl")'

      - name: Purge stale compiled cache and retry once
        if: steps.build_deploy.outcome == 'failure'
        run: |
          echo "::warning::GPU docs build failed on first attempt — purging ${{ steps.depot.outputs.path }}/compiled in case it's a stale precompile cache, then retrying once"
          rm -rf "${{ steps.depot.outputs.path }}/compiled"

      - name: Build and deploy (retry after cache purge)
        if: steps.build_deploy.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
          GKSwstype: 100
          OCCIDATA_GPU_TIME: ${{ inputs.gpu_timeout_minutes }}
        run: |
          ${OCCIDATA_GPU_RUN:-} julia --project=docs/ -e 'ENV["GKSwstype"]="nul"; include("docs/make.jl")'
          echo "📂 Listing docs/build/assets:"
          ls -R docs/build/assets || true
