name: Compat prune (monthly)

# The organization's monthly [compat] prune: every CT* package audited together, one PR per
# repository with something to drop, one tracking issue here in CTActions. The logic is the
# reusable compat-prune.yml; see docs/workflows/compat-prune.md.

on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only audit and report: no PR, no issue'
        type: boolean
        default: true

concurrency:
  group: compat-prune-monthly
  cancel-in-progress: false

jobs:
  prune:
    uses: ./.github/workflows/compat-prune.yml
    with:
      # The schedule publishes; a manual run is a dry run unless `dry_run` is unticked.
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      # the scripts of the same commit as this workflow
      ctactions_ref: ${{ github.sha }}
    secrets:
      CT_PRUNE_COMPAT_CLIENT_ID: ${{ secrets.CT_PRUNE_COMPAT_CLIENT_ID }}
      CT_PRUNE_COMPAT_PRIVATE_KEY: ${{ secrets.CT_PRUNE_COMPAT_PRIVATE_KEY }}
