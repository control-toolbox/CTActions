name: CI

on:
  workflow_call:
    inputs:
      versions:
        description: "Julia versions to test (JSON array)"
        required: false
        type: string
        default: '["1.10","1.12"]'
      runs_on:
        description: "GitHub runner labels (e.g., 'ubuntu-latest' or JSON array for self-hosted like '[\"self-hosted\", \"Linux\", \"gpu\"]')"
        required: false
        type: string
        default: '["ubuntu-latest","macos-latest","windows-latest"]'
      archs:
        description: "Julia architectures to test (JSON array, e.g., '[\"x64\"]' or '[\"x64\", \"aarch64\"]')"
        required: false
        type: string
        default: '["x64"]'
      runner_type:
        description: "Runner type: 'github' for GitHub-hosted runners or 'self-hosted' for self-hosted runners"
        required: false
        type: string
        default: 'github'
      use_ct_registry:
        description: "Whether the local ct-registry is added or not"
        required: false
        default: false
        type: boolean
      test_args:
        description: "Arguments string forwarded to julia-runtest's test_args (e.g. 'GPU' to select a package's GPU-specific test suite). Empty by default (no arguments)."
        required: false
        type: string
        default: ''
    secrets:
      SSH_KEY:
        required: false
  
jobs:
  test:
    strategy:
      matrix:
        version: ${{ fromJSON(inputs.versions) }}
        runs_on: ${{ fromJSON(inputs.runs_on) }}
        arch: ${{ fromJSON(inputs.archs) }}
    runs-on: ${{ matrix.runs_on }}

    steps:
      # ---------------------------
      # Checkout Repository
      # ---------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # ---------------------------
      # Setup Julia Environment
      # ---------------------------
      - name: Setup Julia
        uses: julia-actions/setup-julia@latest
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}

      # ---------------------------
      # Julia caching (conditional based on runner type)
      # ---------------------------
      # Must precede "Add ct-registry": julia-actions/cache also restores a
      # cached ~/.julia/registries, but skips that restore with "Julia depot
      # registries already exist" if a registry-adding step already ran first —
      # forcing every run to re-clone the (large) General + ct-registry
      # registries via git instead of reusing the cache.
      - name: Cache Julia packages (GitHub-hosted runners)
        if: inputs.runner_type == 'github'
        uses: julia-actions/cache@v3

      # julia-actions/setup-julia does not set JULIA_DEPOT_PATH, so different
      # self-hosted runners can have different real depot locations (e.g. a
      # cluster-wide JULIA_DEPOT_PATH exported by the runner service vs. the
      # Julia default of ~/.julia). Hardcoding ~/.julia below would silently
      # cache/purge nothing on a runner where that's not the real depot. Ask
      # Julia itself where its writable depot is instead of guessing.
      - name: Resolve Julia depot path (self-hosted runners)
        id: depot
        if: inputs.runner_type == 'self-hosted'
        shell: bash
        run: echo "path=$(julia -e 'print(Base.DEPOT_PATH[1])')" >> "$GITHUB_OUTPUT"

      - name: Cache Julia artifacts (self-hosted runners)
        if: inputs.runner_type == 'self-hosted'
        uses: actions/cache@v5
        env:
          cache-name: cache-artifacts
        with:
          path: ${{ steps.depot.outputs.path }}/artifacts
          key: ${{ runner.os }}-test-${{ env.cache-name }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-test-${{ env.cache-name }}-
            ${{ runner.os }}-test-
            ${{ runner.os }}-

      - name: Cache Julia compiled code (self-hosted runners)
        if: inputs.runner_type == 'self-hosted'
        uses: actions/cache@v5
        with:
          path: ${{ steps.depot.outputs.path }}/compiled
          key: ${{ runner.os }}-julia-compiled-${{ matrix.version }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-julia-compiled-${{ matrix.version }}-

      # ---------------------------
      # Add ct-registry
      # ---------------------------
      # add-julia-registry invokes bare `ssh-agent`/`ssh-add`/`ssh-keyscan` (PATH
      # lookup, not a hardcoded path). By default that resolves to Windows'
      # System32 OpenSSH port, which (a) treats a bare `ssh-agent` invocation as a
      # Windows-service start rather than forking a background agent, failing with
      # "unable to start ssh-agent service, error :1058" (ERROR_SERVICE_DISABLED),
      # and (b) is old enough that its `ssh-keyscan github.com` cannot negotiate
      # the sntrup761x25519-sha512@openssh.com post-quantum KEX GitHub now offers,
      # failing with "choose_kex: unsupported KEX method". Git for Windows ships
      # its own (MSYS2-based) OpenSSH client, behaves like the Unix tools these
      # actions expect, and is already installed on GitHub-hosted Windows runners
      # — prepend it to PATH so it's what gets resolved.
      - name: Prefer Git's OpenSSH client (Windows)
        if: inputs.use_ct_registry && runner.os == 'Windows'
        shell: pwsh
        run: echo "C:\Program Files\Git\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Add ct-registry
        if: inputs.use_ct_registry
        uses: julia-actions/add-julia-registry@v2
        env:
          SHELL: /bin/bash
        with:
          key: ${{ secrets.SSH_KEY }}
          registry: control-toolbox/ct-registry

      # add-julia-registry's own ssh-agent (started above) is only ever talked to
      # by system `git`/`ssh`, which is why that step succeeds. Pkg's later git
      # operations in the "Build Julia package" step below — the registry
      # re-fetch during instantiate, and any git-sourced dependency clone (e.g.
      # CTLie) — go through Julia's *bundled* LibGit2 instead, which on Windows
      # can't use that same agent (its named-pipe transport isn't something
      # libssh2 understands there) and fails with "user cancelled credential
      # request".
      #
      # Setting JULIA_PKG_USE_CLI_GIT=true here does NOT fix it:
      # julia-actions/julia-buildpkg's own script unconditionally does
      # `ENV["JULIA_PKG_USE_CLI_GIT"] = <its git_cli input, default false>`
      # before calling Pkg.Registry.add()/Pkg.build(), clobbering whatever we
      # export via GITHUB_ENV. The actual fix is the `git_cli: true` input on
      # that step below, which routes through the same env var but from
      # inside the action, after its own default assignment.

      # ---------------------------
      # Build and test
      # ---------------------------
      # `Pkg.test` builds its sandbox environment (Project.toml + Manifest.toml)
      # with `mktempdir()` — i.e. under $TMPDIR, which defaults to /tmp — and runs
      # the test subprocess with JULIA_LOAD_PATH="@:<that dir>" and JULIA_PROJECT
      # unset. No --project, no @stdlib: that temp directory is the *only* entry on
      # the load path. If it disappears mid-run, every later `using X` fails with
      # "Package X not found in current path" (stdlib `Test` included, because
      # `Base.require` re-runs `identify_package` before looking at already-loaded
      # modules), and a disappearance during precompilation surfaces instead as
      # "N direct dependencies failed to precompile".
      #
      # That is exactly what happens on the occidata runner, whose node wipes /tmp
      # every hour at HH:01: any run whose test window crosses the top of an hour
      # dies. GitHub-hosted runners get a fresh disk per job and are unaffected, so
      # scope this to self-hosted. $RUNNER_TEMP lives under the runner's own _work
      # tree and is cleaned by the runner between jobs, not by the node.
      - name: Keep the Pkg sandbox out of /tmp (self-hosted runners)
        if: inputs.runner_type == 'self-hosted'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/jltmp"
          echo "TMPDIR=$RUNNER_TEMP/jltmp" >> "$GITHUB_ENV"

      - name: Build Julia package
        uses: julia-actions/julia-buildpkg@v1
        with:
          git_cli: ${{ (inputs.use_ct_registry && runner.os == 'Windows') && 'true' || 'false' }}

      # Self-hosted runners reuse a persistent Julia depot across every run
      # (unlike GitHub-hosted runners, whose disk is wiped between jobs), so a
      # compiled/ cache left over from a different branch/Manifest can drift
      # out of sync with what's actually installed and break precompilation
      # for unrelated packages/extensions. Retry once after purging it rather
      # than requiring a runner-specific maintenance job to catch this.
      - name: Run tests
        id: run_tests
        continue-on-error: ${{ inputs.runner_type == 'self-hosted' }}
        uses: julia-actions/julia-runtest@latest
        with:
          test_args: ${{ inputs.test_args }}

      - name: Purge stale compiled cache (self-hosted runners)
        if: ${{ !cancelled() && inputs.runner_type == 'self-hosted' && steps.run_tests.outcome == 'failure' }}
        run: |
          echo "::warning::Tests failed on first attempt — purging ${{ steps.depot.outputs.path }}/compiled in case it's a stale precompile cache, then retrying once"
          rm -rf "${{ steps.depot.outputs.path }}/compiled"

      - name: Run tests (retry after cache purge, self-hosted runners)
        if: ${{ !cancelled() && inputs.runner_type == 'self-hosted' && steps.run_tests.outcome == 'failure' }}
        uses: julia-actions/julia-runtest@latest
        with:
          test_args: ${{ inputs.test_args }}
