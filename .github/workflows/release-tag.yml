name: Release tag

# Tags a release once its PR is merged (REL5): on `main`, when `version` in Project.toml has
# no tag yet, the commit that set it (its first parent has another version: the merge
# commit of the release PR) is tagged `vX.Y.Z` and gets its GitHub release, notes generated
# since the previous stable (since the previous release for a beta), a beta marked
# pre-release. Nothing to do otherwise; a rerun after a failure does what is left, never
# twice. Plan: scripts/release/release.jl tag-plan.
#
# A tag created with GITHUB_TOKEN triggers no workflow, but GITHUB_TOKEN may dispatch one:
# the job then runs the documentation workflow on the tag (Documenter deploys a tag on
# `workflow_dispatch`), so the documentation of the version is published without any
# other credential. The caller grants `contents: write` and `actions: write`. See
# docs/workflows/release-tag.md.

on:
  workflow_call:
    inputs:
      documentation_workflow:
        description: 'The workflow file that builds the documentation, run on the new tag; empty: none'
        required: false
        type: string
        default: Documentation.yml
      ctactions_ref:
        description: 'Ref of CTActions the script is checked out from'
        required: false
        type: string
        default: main

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write         # the tag and the GitHub release
      actions: write          # the documentation workflow, dispatched on the tag
    concurrency:
      group: release-tag-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/checkout@v6
        with:
          repository: control-toolbox/CTActions
          ref: ${{ inputs.ctactions_ref }}
          path: .ctactions

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - name: Plan
        id: plan
        run: |
          julia --startup-file=no .ctactions/scripts/release/release.jl tag-plan . | tee -a "$GITHUB_OUTPUT"

      - name: Tag and release
        if: steps.plan.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DOC: ${{ inputs.documentation_workflow }}
          TAG: ${{ steps.plan.outputs.tag }}
          TARGET: ${{ steps.plan.outputs.target }}
          PREVIOUS: ${{ steps.plan.outputs.previous }}
          PRERELEASE: ${{ steps.plan.outputs.prerelease }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --target "$TARGET" --title "$TAG" --generate-notes)
          [ -n "$PREVIOUS" ] && args+=(--notes-start-tag "$PREVIOUS")
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); else args+=(--latest); fi
          gh release create "$TAG" "${args[@]}"
          docs="no documentation workflow"
          if [ -n "$DOC" ] && [ -f ".github/workflows/$DOC" ]; then
            gh workflow run "$DOC" --repo "$GITHUB_REPOSITORY" --ref "$TAG"
            docs="$DOC dispatched on $TAG"
          fi
          {
            echo "## Release tag — $TAG"
            echo
            echo "Tagged $TARGET; notes since ${PREVIOUS:-the beginning}; $( [ "$PRERELEASE" = true ] && echo pre-release || echo latest ); $docs."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Nothing to tag
        if: steps.plan.outputs.tag == ''
        env:
          REASON: ${{ steps.plan.outputs.reason }}
        run: |
          echo "## Release tag — nothing to do: $REASON" >> "$GITHUB_STEP_SUMMARY"
