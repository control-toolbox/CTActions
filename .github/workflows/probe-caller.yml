name: Probe caller
on:
  push:
    branches: ['probe/**']
  pull_request:
jobs:
  github:
    uses: ./.github/workflows/probe-wf.yml
    with:
      runner_type: github
      runs_on: '["ubuntu-latest"]'
  kkt:
    uses: ./.github/workflows/probe-wf.yml
    with:
      runner_type: self-hosted
      runs_on: '[["kkt"]]'
  occidata:
    uses: ./.github/workflows/probe-wf.yml
    with:
      runner_type: self-hosted
      runs_on: '[["occidata"]]'
