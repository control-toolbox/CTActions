name: Add ct-registry
description: >
  Adds control-toolbox's ct-registry to the Julia depot. With a key (the SSH key of the
  organization), through julia-actions/add-julia-registry as before. Without one (a pull
  request from a fork: GitHub passes no secret to it), from the public HTTPS URL, with
  General alongside, since a depot whose only registry is ct-registry has no General.
  Julia must be set up before.

inputs:
  key:
    description: "SSH key of the organization (secrets.SSH_KEY); empty on a pull request from a fork"
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Add ct-registry (SSH key)
      if: inputs.key != ''
      uses: julia-actions/add-julia-registry@v2
      env:
        SHELL: /bin/bash
      with:
        key: ${{ inputs.key }}
        registry: control-toolbox/ct-registry

    - name: Add ct-registry (public HTTPS, no SSH key)
      if: inputs.key == ''
      shell: bash
      run: |
        echo "::notice::No SSH key (a pull request from a fork gets no secret): adding ct-registry from its public URL."
        julia --startup-file=no -e '
          using Pkg
          Pkg.Registry.add([RegistrySpec(name="General"),
                            RegistrySpec(url="https://github.com/control-toolbox/ct-registry.git")])'
