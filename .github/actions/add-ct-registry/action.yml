name: Add ct-registry
description: >
  Adds control-toolbox's ct-registry to the Julia depot. With a key (the SSH key of the
  organization), through julia-actions/add-julia-registry as before. Without one (a pull
  request from a fork: GitHub passes no secret to it), from the public HTTPS URL, with
  General alongside, since a depot whose only registry is ct-registry has no General.
  Skipped on a pull request that sets a stable version (REL4: a stable release resolves from
  General alone), unless `skip_on_stable` is 'false'. Julia must be set up and the repository
  checked out before.

inputs:
  key:
    description: "SSH key of the organization (secrets.SSH_KEY); empty on a pull request from a fork"
    required: false
    default: ''

  skip_on_stable:
    description: "Skip ct-registry on a pull request that sets a stable version ('false' to keep it)"
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # `release.jl stable-release` decides; without a pull request, or a base to compare with,
    # ct-registry is added as before. The pull request is `pull_request`'s, or the `pr` input of a
    # run dispatched by a label (label-dispatch.yml), which has no `pull_request` payload.
    - name: Is this a stable release pull request?
      id: mode
      if: inputs.skip_on_stable == 'true'
      shell: bash
      env:
        PR: ${{ github.event.pull_request.number || github.event.inputs.pr }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        GH_TOKEN: ${{ github.token }}
      run: |
        stable=false
        if [ -n "$PR" ]; then
          [ -n "$BASE_SHA" ] || BASE_SHA=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json baseRefOid --jq .baseRefOid) || BASE_SHA=
        fi
        if [ -n "$BASE_SHA" ] && git fetch --quiet --depth=1 origin "$BASE_SHA" && git show "$BASE_SHA:Project.toml" > "$RUNNER_TEMP/base-Project.toml"; then
          stable=$(julia --startup-file=no "${{ github.action_path }}/../../../scripts/release/release.jl" \
                   stable-release --base "$RUNNER_TEMP/base-Project.toml" Project.toml | sed -n 's/^stable=//p')
        fi
        [ "$stable" = true ] || stable=false
        echo "stable=$stable" >> "$GITHUB_OUTPUT"
        [ "$stable" = true ] && echo "::notice::Stable release pull request: ct-registry is not added (REL4, General alone)."
        exit 0

    - name: Add ct-registry (SSH key)
      if: steps.mode.outputs.stable != 'true' && inputs.key != ''
      uses: julia-actions/add-julia-registry@v2
      env:
        SHELL: /bin/bash
      with:
        key: ${{ inputs.key }}
        registry: control-toolbox/ct-registry

    - name: Add ct-registry (public HTTPS, no SSH key)
      if: steps.mode.outputs.stable != 'true' && inputs.key == ''
      shell: bash
      run: |
        echo "::notice::No SSH key (a pull request from a fork gets no secret): adding ct-registry from its public URL."
        julia --startup-file=no -e '
          using Pkg
          Pkg.Registry.add([RegistrySpec(name="General"),
                            RegistrySpec(url="https://github.com/control-toolbox/ct-registry.git")])'
